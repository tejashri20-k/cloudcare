<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - CloudCare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">CloudCare Aggregator</a>
    <div class="nav-links">
      <a href="register.html">Register</a>
    </div>
  </nav>

  <div class="auth-card">
    <h2>Welcome Back</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Sign in to your account</p>

    <div id="loginError" style="display:none; background:#fee2e2; color:#b91c1c; border:1px solid #fecaca; border-radius:6px; padding:0.75rem; margin-bottom:1rem; font-size:0.9rem;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>I am a:</label>
        <select id="userRole" required>
          <option value="patient">Patient</option>
          <option value="doctor">Doctor</option>
          <option value="clinic">Clinic Administrator</option>
        </select>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>

      <button type="submit" id="loginBtn" class="btn" style="width: 100%;">Sign In</button>
    </form>

    <p style="font-size: 0.85rem; text-align: center; margin-top: 1.25rem;">
      Don't have an account? <a href="register.html">Register</a>
    </p>
  </div>

  <script src="config.js"></script>
  <script>
    const API_BASE = window.APP_CONFIG.API_BASE;
    const errorBox = document.getElementById('loginError');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      errorBox.style.display = 'none';

      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;
      const roleValue = document.getElementById('userRole').value; // patient | doctor | clinic
      const role = roleValue.charAt(0).toUpperCase() + roleValue.slice(1); // Patient | Doctor | Clinic

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });
        const result = await response.json();

        if (!response.ok) {
          showError(result.error || 'Login failed. Please try again.');
          return;
        }

        // Save the logged-in user (the dashboards read this)
        localStorage.setItem('user', JSON.stringify(result.user));
        localStorage.setItem('token', result.token);

        const pages = {
          Patient: 'patient-dashboard.html',
          Doctor: 'doctor-dashboard.html',
          Clinic: 'clinic-dashboard.html'
        };
        window.location.href = pages[result.user.role];
      } catch (err) {
        showError('Could not reach the server. Make sure the backend is running (node server.js).');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
